<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clínica Médica - API</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
    --ok: #16a34a;
    --danger: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--primary);
    color: #fff;
    padding: 18px 24px;
  }
  header h1 { margin: 0 0 4px; font-size: 20px; }
  header p { margin: 0; font-size: 13px; opacity: .9; }
  header a { color: #fff; }
  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 12px 24px;
    background: #fff;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .tabs button {
    border: 1px solid var(--border);
    background: #fff;
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text);
  }
  .tabs button.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
  }
  main { padding: 20px 24px 60px; }
  .panel { display: none; }
  .panel.active { display: block; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  .card h2 { margin: 0 0 12px; font-size: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  input {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
  }
  button.btn {
    border: none;
    background: var(--primary);
    color: #fff;
    padding: 9px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }
  button.btn:hover { background: var(--primary-dark); }
  button.btn.secondary { background: #eef2ff; color: var(--primary-dark); }
  .form-actions { margin-top: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { background: #f9fafb; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
  tr:hover td { background: #fafbff; }
  .row-actions { display: flex; flex-wrap: wrap; gap: 6px; }
  .row-actions button {
    border: 1px solid var(--border);
    background: #fff;
    padding: 4px 9px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
  }
  .row-actions button:hover { border-color: var(--primary); color: var(--primary-dark); }
  .row-actions button.danger:hover { border-color: var(--danger); color: var(--danger); }
  #output {
    position: fixed;
    right: 16px;
    bottom: 16px;
    width: 420px;
    max-height: 46vh;
    background: #0f172a;
    color: #d1e7ff;
    border-radius: 10px;
    padding: 12px 14px;
    font-family: Consolas, "Courier New", monospace;
    font-size: 12px;
    overflow: auto;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
    display: none;
  }
  #output.show { display: block; }
  #output .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; color: #93c5fd; }
  #output .head button { background: transparent; border: none; color: #93c5fd; cursor: pointer; font-size: 14px; }
  #output pre { margin: 0; white-space: pre-wrap; word-break: break-word; }
  .empty { color: var(--muted); font-size: 13px; padding: 10px 0; }
  .hint { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Clínica Médica · API REST</h1>
  <p>Spring Boot + JavaScript. Documentação: <a href="/swagger-ui.html" target="_blank">/swagger-ui.html</a> · <a href="/v3/api-docs" target="_blank">/v3/api-docs</a></p>
</header>

<div class="tabs" id="tabs"></div>

<main id="main"></main>

<div id="output">
  <div class="head">
    <span id="output-title">Resposta</span>
    <button type="button" onclick="document.getElementById('output').classList.remove('show')">&times;</button>
  </div>
  <pre id="output-body"></pre>
</div>

<script src="/js/masks.js"></script>
<script>
/* Fallback caso /js/masks.js nao seja carregado. */
const Mask = window.Mascaras || {
  atributos: () => '',
  valorNumerico: v => { const n = Number(String(v ?? '').replace(/\./g, '').replace(',', '.')); return isNaN(n) ? NaN : n; }
};

const resources = [
  {
    key: 'pacientes',
    title: 'Pacientes',
    path: '/api/pacientes',
    fields: [
      { name: 'cpf', label: 'CPF', mask: 'cpf' },
      { name: 'nome', label: 'Nome', mask: 'letras' },
      { name: 'dataNasc', label: 'Data de nascimento', mask: 'data' },
      { name: 'telefone', label: 'Telefone', mask: 'telefone' }
    ],
    columns: [
      { path: 'id', label: 'ID' },
      { path: 'nome', label: 'Nome' },
      { path: 'cpf', label: 'CPF' },
      { path: 'dataNasc', label: 'Nascimento' },
      { path: 'telefone', label: 'Telefone' },
      { path: 'convenios', label: 'Convênios', format: v => (v || []).map(c => (getPath(c, 'convenio.nome') || '?') + ': ' + (c.numeroCarteirinha || '—')).join(', ') || '—' }
    ],
    actions: [
      { label: 'Histórico', run: async item => api('GET', `/api/pacientes/${item.id}/historico`) },
      { label: 'Cadastrar', run: async item => api('POST', `/api/pacientes/${item.id}/cadastrar`) },
      {
        label: 'Editar dados',
        run: async item => {
          const nome = prompt('Novo nome:', item.nome);
          if (nome === null) return;
          const telefone = prompt('Novo telefone:', item.telefone);
          if (telefone === null) return;
          await api('PUT', `/api/pacientes/${item.id}/dados?nome=${encodeURIComponent(nome)}&telefone=${encodeURIComponent(telefone)}`);
        }
      },
      {
        label: 'Vincular convênio',
        run: async item => {
          const id = prompt('ID do convênio (operadora):');
          if (!id) return;
          const carteirinha = prompt('Nº da carteirinha deste paciente:');
          if (!carteirinha) return;
          await api('POST', `/api/pacientes/${item.id}/convenios/${id}?numeroCarteirinha=${encodeURIComponent(carteirinha)}`);
        }
      }
    ]
  },
  {
    key: 'medicos',
    title: 'Médicos',
    path: '/api/medicos',
    fields: [
      { name: 'nome', label: 'Nome', mask: 'letras' },
      { name: 'crm', label: 'CRM', mask: 'crm' }
    ],
    columns: [
      { path: 'id', label: 'ID' },
      { path: 'nome', label: 'Nome' },
      { path: 'crm', label: 'CRM' },
      { path: 'especialidades', label: 'Especialidades', format: v => (v || []).map(e => e.nome).join(', ') || '-' }
    ],
    actions: [
      { label: 'Agenda', run: async item => api('GET', `/api/medicos/${item.id}/agenda`) },
      {
        label: 'Add especialidade',
        run: async item => {
          const id = prompt('ID da especialidade:');
          if (!id) return;
          await api('POST', `/api/medicos/${item.id}/especialidades/${id}`);
        }
      }
    ]
  },
  {
    key: 'especialidades',
    title: 'Especialidades',
    path: '/api/especialidades',
    fields: [
      { name: 'nome', label: 'Nome', mask: 'letras' },
      { name: 'descricao', label: 'Descrição', mask: 'texto' }
    ],
    columns: [
      { path: 'id', label: 'ID' },
      { path: 'nome', label: 'Nome' },
      { path: 'descricao', label: 'Descrição' }
    ],
    actions: [
      { label: 'Médicos', run: async item => api('GET', `/api/especialidades/${item.id}/medicos`) }
    ]
  },
  {
    key: 'convenios',
    title: 'Convênios',
    path: '/api/convenios',
    fields: [
      { name: 'nome', label: 'Nome da operadora', mask: 'alfanumerico' },
      { name: 'cnpj', label: 'CNPJ da operadora', mask: 'cnpj' },
      { name: 'codigoAns', label: 'Código ANS', mask: '000000' }
    ],
    columns: [
      { path: 'id', label: 'ID' },
      { path: 'nome', label: 'Operadora' },
      { path: 'cnpj', label: 'CNPJ' },
      { path: 'codigoAns', label: 'Código ANS' }
    ],
    actions: [
      { label: 'Pacientes', run: async item => api('GET', `/api/convenios/${item.id}/vinculos`) }
    ]
  },
  {
    key: 'consultas',
    title: 'Consultas',
    path: '/api/consultas',
    fields: [
      { name: 'data', label: 'Data (dd/mm/aaaa)', mask: 'data' },
      { name: 'horario', label: 'Horário (hh:mm)', mask: 'hora' },
      { name: 'paciente.id', label: 'ID do paciente', type: 'number' },
      { name: 'medico.id', label: 'ID do médico', type: 'number' }
    ],
    columns: [
      { path: 'id', label: 'ID' },
      { path: 'data', label: 'Data' },
      { path: 'horario', label: 'Hora' },
      { path: 'paciente.nome', label: 'Paciente' },
      { path: 'medico.nome', label: 'Médico' },
      { path: 'diagnostico', label: 'Diagnóstico' }
    ],
    actions: [
      {
        label: 'Registrar atendimento',
        run: async item => {
          const queixaPrincipal = prompt('Queixa principal:', item.queixaPrincipal || '');
          if (queixaPrincipal === null) return;
          const diagnostico = prompt('Diagnóstico:', item.diagnostico || '');
          if (diagnostico === null) return;
          const observacoes = prompt('Observações:', item.observacoes || '');
          if (observacoes === null) return;
          await api('POST', `/api/consultas/${item.id}/atendimento`, { queixaPrincipal, diagnostico, observacoes });
        }
      },
      {
        label: 'Solicitar exame',
        run: async item => {
          const nome = prompt('Nome do exame:');
          if (!nome) return;
          const tipo = prompt('Tipo do exame:') || '';
          await api('POST', `/api/consultas/${item.id}/exames`, { nome, tipo });
        }
      },
      { label: 'Gerar prescrição', run: async item => api('POST', `/api/consultas/${item.id}/prescricao`) },
      {
        label: 'Add pagamento',
        run: async item => {
          const valor = prompt('Valor:');
          if (!valor) return;
          const formaPagamento = prompt('Forma de pagamento (PIX, DINHEIRO...):') || '';
          await api('POST', `/api/consultas/${item.id}/pagamentos`, { data: item.data, valor: Number(valor), formaPagamento });
        }
      },
      {
        label: 'Add procedimento',
        run: async item => {
          const nome = prompt('Nome do procedimento:');
          if (!nome) return;
          const valor = Number(prompt('Valor:') || 0);
          await api('POST', `/api/consultas/${item.id}/procedimentos`, { nome, valorPadrao: valor, valorCobrado: valor });
        }
      }
    ]
  },
  {
    key: 'exames',
    title: 'Exames',
    path: '/api/exames',
    fields: [
      { name: 'nome', label: 'Nome', mask: 'alfanumerico' },
      { name: 'tipo', label: 'Tipo', mask: 'alfanumerico' },
      { name: 'consulta.id', label: 'ID da consulta de origem', type: 'number' },
      { name: 'dataSolicitacao', label: 'Data de solicitação', mask: 'data' }
    ],
    columns: [
      { path: 'id', label: 'ID' },
      { path: 'nome', label: 'Nome' },
      { path: 'tipo', label: 'Tipo' },
      { path: 'consulta.id', label: 'Consulta', format: (v, item) => referencia(v, getPath(item, 'consulta.data')) },
      { path: 'consulta.paciente.nome', label: 'Paciente', format: v => v || '—' },
      { path: 'situacao', label: 'Situação' }
    ],
    actions: [
      {
        label: 'Registrar resultado',
        /* Só aparece enquanto o exame não tem resultado (situação CONCLUIDO). */
        when: item => !item.resultado,
        run: async item => {
          const data = prompt('Data do resultado:', new Date().toLocaleDateString('pt-BR'));
          if (data === null) return;
          const descricao = prompt('Descrição:') || '';
          const conclusao = prompt('Conclusão:') || '';
          await api('POST', `/api/exames/${item.id}/resultado`, { data, descricao, conclusao });
        }
      }
    ]
  },
  {
    key: 'resultados-exame',
    title: 'Resultados de Exame',
    path: '/api/resultados-exame',
    fields: [
      { name: 'data', label: 'Data', mask: 'data' },
      { name: 'descricao', label: 'Descrição', mask: 'texto' },
      { name: 'conclusao', label: 'Conclusão', mask: 'texto' }
    ],
    columns: [
      { path: 'id', label: 'ID' },
      { path: 'data', label: 'Data' },
      { path: 'exame.id', label: 'Exame', format: (v, item) => referencia(v, getPath(item, 'exame.nome')) },
      { path: 'exame.consulta.paciente.nome', label: 'Paciente', format: v => v || '—' },
      { path: 'descricao', label: 'Descrição' },
      { path: 'conclusao', label: 'Conclusão' }
    ]
  },
  {
    key: 'prescricoes',
    title: 'Prescrições',
    path: '/api/prescricoes',
    fields: [{ name: 'data', label: 'Data', mask: 'data' }],
    columns: [
      { path: 'id', label: 'ID' },
      { path: 'data', label: 'Data' },
      { path: 'consulta.id', label: 'Consulta', format: (v, item) => referencia(v, getPath(item, 'consulta.data')) },
      { path: 'consulta.paciente.nome', label: 'Paciente', format: v => v || '—' },
      { path: 'medicamentos', label: 'Medicamentos', format: v => (v || []).map(m => m.nome).join(', ') || '-' }
    ],
    actions: [
      {
        label: 'Add medicamento',
        run: async item => {
          const nome = prompt('Nome do medicamento:');
          if (!nome) return;
          const dose = prompt('Dose:') || '';
          const frequencia = prompt('Frequência:') || '';
          const duracao = prompt('Duração:') || '';
          await api('POST', `/api/prescricoes/${item.id}/medicamentos`, { nome, dose, frequencia, duracao });
        }
      }
    ]
  },
  {
    key: 'medicamentos',
    title: 'Medicamentos',
    path: '/api/medicamentos',
    fields: [
      { name: 'nome', label: 'Nome', mask: 'alfanumerico' },
      { name: 'dose', label: 'Dose', mask: 'alfanumerico' },
      { name: 'frequencia', label: 'Frequência', mask: 'alfanumerico' },
      { name: 'duracao', label: 'Duração', mask: 'alfanumerico' }
    ],
    columns: [
      { path: 'id', label: 'ID' },
      { path: 'nome', label: 'Nome' },
      { path: 'dose', label: 'Dose' },
      { path: 'frequencia', label: 'Frequência' },
      { path: 'duracao', label: 'Duração' }
    ]
  },
  {
    key: 'pagamentos',
    title: 'Pagamentos',
    path: '/api/pagamentos',
    fields: [
      { name: 'consulta.id', label: 'ID da consulta', type: 'number' },
      { name: 'data', label: 'Data', mask: 'data' },
      { name: 'valor', label: 'Valor', type: 'number', mask: 'dinheiro', valueType: 'dinheiro' },
      { name: 'formaPagamento', label: 'Forma de pagamento', mask: 'alfanumerico' }
    ],
    columns: [
      { path: 'id', label: 'ID' },
      { path: 'consulta.id', label: 'Consulta', format: (v, item) => referencia(v, getPath(item, 'consulta.data')) },
      { path: 'consulta.paciente.nome', label: 'Paciente', format: v => v || '—' },
      { path: 'data', label: 'Data' },
      { path: 'valor', label: 'Valor' },
      { path: 'formaPagamento', label: 'Forma' },
      { path: 'situacao', label: 'Situação' }
    ],
    actions: [
      { label: 'Pagar', when: item => item.situacao !== 'PAGO', run: async item => api('POST', `/api/pagamentos/${item.id}/pagar`) },
      { label: 'Estornar', when: item => item.situacao !== 'ESTORNADO', run: async item => api('POST', `/api/pagamentos/${item.id}/estornar`) }
    ]
  },
  {
    key: 'procedimentos',
    title: 'Procedimentos',
    path: '/api/procedimentos',
    fields: [
      { name: 'nome', label: 'Nome', mask: 'alfanumerico' },
      { name: 'valorPadrao', label: 'Valor padrão', type: 'number', mask: 'dinheiro', valueType: 'dinheiro' },
      { name: 'valorCobrado', label: 'Valor cobrado', type: 'number', mask: 'dinheiro', valueType: 'dinheiro' }
    ],
    columns: [
      { path: 'id', label: 'ID' },
      { path: 'nome', label: 'Nome' },
      { path: 'valorPadrao', label: 'Valor padrão' },
      { path: 'valorCobrado', label: 'Valor cobrado' }
    ],
    actions: [
      { label: 'Realizar', run: async item => api('POST', `/api/procedimentos/${item.id}/realizar`) }
    ]
  }
];

/* ---------- utilitários ---------- */

function getPath(obj, path) {
  return path.split('.').reduce((acc, part) => (acc == null ? undefined : acc[part]), obj);
}

function setPath(obj, path, value) {
  const parts = path.split('.');
  let cur = obj;
  for (let i = 0; i < parts.length - 1; i++) {
    cur[parts[i]] = cur[parts[i]] || {};
    cur = cur[parts[i]];
  }
  cur[parts[parts.length - 1]] = value;
}

/** Monta "#12 · Cardiologia" / "#12" / "—" para colunas que apontam para outro registro. */
function referencia(id, complemento) {
  if (id == null || id === '') return '—';
  return complemento ? `#${id} · ${complemento}` : `#${id}`;
}

function escapeHtml(value) {
  return String(value ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;');
}

function showOutput(title, status, data) {
  const box = document.getElementById('output');
  document.getElementById('output-title').textContent = `${title} · HTTP ${status}`;
  document.getElementById('output-body').textContent = JSON.stringify(data, null, 2);
  box.classList.add('show');
}

async function api(method, url, body) {
  const options = { method, headers: {} };
  if (body !== undefined) {
    options.headers['Content-Type'] = 'application/json';
    options.body = JSON.stringify(body);
  }
  const response = await fetch(url, options);
  const text = await response.text();
  let data = text;
  try { data = text ? JSON.parse(text) : null; } catch (e) { /* mantém texto */ }
  showOutput(`${method} ${url}`, response.status, data);
  if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
  return data;
}

/* ---------- construção da interface ---------- */

function buildBody(resource, form) {
  const body = {};
  for (const field of resource.fields) {
    let value = form.elements[field.name].value.trim();
    if (value === '') continue;
    if (field.valueType === 'dinheiro') {
      const numero = Mask.valorNumerico(value);
      value = isNaN(numero) ? 0 : numero;
    } else if (field.type === 'number') {
      value = Number(value);
    }
    setPath(body, field.name, value);
  }
  return body;
}

function renderForm(resource) {
  const inputs = resource.fields.map(field => {
    const money = field.valueType === 'dinheiro';
    const type = money ? 'text' : (field.type === 'number' ? 'number' : 'text');
    return `
    <div>
      <label for="${resource.key}-${field.name}">${escapeHtml(field.label)}</label>
      <input id="${resource.key}-${field.name}" name="${field.name}"
             type="${type}" ${Mask.atributos(field)}
             ${field.type === 'number' && !money ? 'step="any"' : ''}>
    </div>`;
  }).join('');

  return `
    <div class="card">
      <h2>Novo registro</h2>
      <form id="form-${resource.key}">
        <div class="grid">${inputs}</div>
        <div class="form-actions">
          <button class="btn" type="submit">Criar</button>
        </div>
      </form>
    </div>`;
}

function renderTable(resource) {
  const headers = resource.columns.map(c => `<th>${escapeHtml(c.label)}</th>`).join('');
  return `
    <div class="card">
      <h2>${escapeHtml(resource.title)} <span class="hint">(${resource.path})</span></h2>
      <div id="table-${resource.key}">
        <table>
          <thead><tr>${headers}<th>Ações</th></tr></thead>
          <tbody id="tbody-${resource.key}"></tbody>
        </table>
      </div>
    </div>`;
}

function renderPanel(resource) {
  return `<section class="panel" id="panel-${resource.key}">
      ${renderForm(resource)}
      ${renderTable(resource)}
    </section>`;
}

function renderRow(resource, item) {
  const cells = resource.columns.map(column => {
    const raw = getPath(item, column.path);
    const text = column.format ? column.format(raw, item) : raw;
    return `<td>${escapeHtml(text)}</td>`;
  }).join('');

  const actionButtons = (resource.actions || [])
    .map((action, index) => ({ action, index }))
    .filter(({ action }) => !action.when || action.when(item))
    .map(({ action, index }) => `<button type="button" data-action="${index}">${escapeHtml(action.label)}</button>`)
    .join('');

  return `<tr data-id="${item.id}">
    ${cells}
    <td>
      <div class="row-actions">
        ${actionButtons}
        <button type="button" class="danger" data-action="delete">Excluir</button>
      </div>
    </td>
  </tr>`;
}

async function loadResource(resource) {
  const tbody = document.getElementById(`tbody-${resource.key}`);
  try {
    const items = await api('GET', resource.path);
    if (!items || items.length === 0) {
      tbody.innerHTML = `<tr><td colspan="${resource.columns.length + 1}" class="empty">Nenhum registro. Use o formulário acima para criar.</td></tr>`;
      return;
    }
    tbody.innerHTML = items.map(item => renderRow(resource, item)).join('');
    tbody.querySelectorAll('tr[data-id]').forEach(row => {
      const id = Number(row.dataset.id);
      const item = items.find(i => i.id === id);
      row.querySelectorAll('button[data-action]').forEach(button => {
        button.addEventListener('click', async () => {
          const action = button.dataset.action;
          try {
            if (action === 'delete') {
              if (!confirm(`Excluir registro ${id}?`)) return;
              await api('DELETE', `${resource.path}/${id}`);
            } else {
              await resource.actions[Number(action)].run(item, resource);
            }
            await loadResource(resource);
          } catch (error) {
            alert('Erro: ' + error.message);
          }
        });
      });
    });
  } catch (error) {
    tbody.innerHTML = `<tr><td colspan="${resource.columns.length + 1}" class="empty">Erro ao carregar: ${escapeHtml(error.message)}</td></tr>`;
  }
}

function setupResource(resource) {
  const form = document.getElementById(`form-${resource.key}`);
  form.addEventListener('submit', async event => {
    event.preventDefault();
    try {
      await api('POST', resource.path, buildBody(resource, form));
      form.reset();
      await loadResource(resource);
    } catch (error) {
      alert('Erro: ' + error.message);
    }
  });
}

function init() {
  const tabs = document.getElementById('tabs');
  const main = document.getElementById('main');

  main.innerHTML = resources.map(renderPanel).join('');

  resources.forEach((resource, index) => {
    const button = document.createElement('button');
    button.textContent = resource.title;
    if (index === 0) button.classList.add('active');
    button.addEventListener('click', () => activate(resource.key));
    tabs.appendChild(button);

    setupResource(resource);
  });

  activate(resources[0].key);
}

function activate(key) {
  document.querySelectorAll('.tabs button').forEach(button => {
    button.classList.toggle('active', button.textContent === resources.find(r => r.key === key).title);
  });
  document.querySelectorAll('.panel').forEach(panel => {
    panel.classList.toggle('active', panel.id === `panel-${key}`);
  });
  loadResource(resources.find(r => r.key === key));
}

init();
</script>
</body>
</html>
